name: Mini Sitio CI

on:
  push:
    branches:
      - main
      - release/v1.0
  pull_request:
    branches:
      - main

jobs:
  validar-sitio:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Mensaje de validación
        run: echo "Sitio validado correctamente"